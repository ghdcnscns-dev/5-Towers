<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>다섯 개의 탑 - 보드게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(to bottom, #E0F2FE, #BAE6FD);
            color: #1E293B;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .crayon-border {
            border: 3px dashed #38BDF8;
            border-radius: 0.8rem;
            background: #FFFFFF;
            box-shadow: 0 4px 0 #0284C7;
        }
        .crayon-btn {
            transition: all 0.1s ease;
            box-shadow: 0 3px 0 #0369A1;
        }
        .crayon-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #0369A1;
        }
        .tower-block {
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 max-w-md mx-auto pb-6">

    <!-- 상단: 타이틀 및 전체 초기화 버튼 -->
    <header class="w-full bg-white/95 backdrop-blur crayon-border p-3 mb-3 flex flex-row justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🏛️</span>
            <div>
                <h1 class="text-lg text-sky-600 leading-tight">다섯 개의 탑</h1>
                <p class="text-[11px] text-slate-400">대장탑 수동 지정 기능 추가</p>
            </div>
        </div>
        <button onclick="resetAll()" class="bg-rose-400 hover:bg-rose-500 text-white text-xs px-3 py-1.5 rounded-lg crayon-btn font-bold">
            🔄 전체 초기화
        </button>
    </header>

    <!-- 중앙: 플레이어 관리 및 탑 비주얼 건설 현황 -->
    <main class="w-full flex flex-col gap-3 mb-3 flex-grow">
        
        <!-- 플레이어 선택 및 추가 구역 -->
        <section class="bg-white/95 crayon-border p-3 flex flex-col gap-2">
            <div class="flex justify-between items-center border-b border-sky-100 pb-1.5">
                <span class="text-base text-sky-700 font-bold">👥 플레이어 관리</span>
                <div class="flex items-center gap-1.5">
                    <input type="text" id="new-player-name" placeholder="이름 입력" class="text-xs px-2 py-1 rounded border border-sky-300 w-24 outline-none">
                    <button onclick="addPlayer()" class="bg-sky-500 text-white text-xs px-2.5 py-1 rounded crayon-btn font-bold">추가</button>
                </div>
            </div>
            <!-- 플레이어 탭 목록 (삭제 버튼 포함) -->
            <div id="player-tabs" class="flex gap-1.5 overflow-x-auto py-1 items-center">
                <!-- 동적 생성 -->
            </div>
        </section>

        <!-- 현재 선택된 플레이어의 비주얼 탑 건설 구역 -->
        <section class="bg-white/95 crayon-border p-3 flex flex-col gap-2.5">
            <div class="flex justify-between items-center border-b border-sky-100 pb-1.5">
                <span id="current-player-title" class="text-base text-sky-700 font-bold">🏗️ 플레이어의 탑 건설 현황</span>
                <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full font-bold">대장탑 수동/자동</span>
            </div>
            
            <!-- 비주얼 탑 5종 컨테이너 -->
            <div id="towers-container" class="grid grid-cols-5 gap-1.5 py-1">
                <!-- 동적 생성 -->
            </div>
        </section>

        <!-- 허문카드 더미 감점 설정 -->
        <section class="bg-white/95 crayon-border p-3 flex flex-col gap-2">
            <h2 class="text-base text-rose-600 border-b border-rose-100 pb-1.5 flex justify-between items-center">
                <span>🗑️ 허문카드 더미 (감점)</span>
                <span class="text-[11px] text-rose-500 font-bold" id="penalty-score-text">-0점</span>
            </h2>
            <div class="flex items-center justify-between bg-rose-50 p-2.5 rounded-lg border border-rose-200">
                <span class="text-xs text-rose-900">허문카드 장수 (-1, -2, -3...)</span>
                <div class="flex items-center gap-2">
                    <button onclick="adjustPenalty(-1)" class="w-7 h-7 bg-rose-200 text-rose-800 rounded font-bold">-</button>
                    <span id="penalty-count" class="font-bold text-sm w-5 text-center">0</span>
                    <button onclick="adjustPenalty(1)" class="w-7 h-7 bg-rose-400 text-white rounded font-bold">+</button>
                </div>
            </div>
        </section>

        <!-- 현재 플레이어 최종 점수 요약 -->
        <section class="bg-sky-50 p-3 rounded-xl border-2 border-sky-300 flex justify-between items-center">
            <div>
                <span class="text-xs text-sky-900 font-bold block" id="current-player-score-label">최종 점수</span>
                <span class="text-[10px] text-slate-500">(탑 득점 + 대장보너스) - (허문카드 감점)</span>
            </div>
            <div class="text-2xl text-sky-600 font-bold" id="final-score-display">0 점</div>
        </section>

        <!-- 제일 하단: 실시간 탑 비주얼 점수 현황판 (랭킹) -->
        <section class="bg-white/95 crayon-border p-3 flex flex-col gap-2 mt-2">
            <h2 class="text-base text-sky-700 border-b border-sky-100 pb-1.5 flex justify-between items-center">
                <span>🏆 실시간 점수계산기</span>
                <span class="text-[10px] bg-sky-100 text-sky-600 px-2 py-0.5 rounded-full">다섯개의탑</span>
            </h2>
            <div id="ranking-list" class="flex flex-col gap-2">
                <!-- 동적 랭킹 주입 -->
            </div>
        </section>
    </main>

    <!-- 제작자 정보 -->
    <footer class="w-full bg-white/95 crayon-border p-2.5 text-center flex flex-row justify-between items-center text-xs text-slate-500">
        <span>다섯 개의 탑 게임</span>
        <span class="font-bold text-sky-600">제작자: 천상민</span>
    </footer>

    <script>
        // 초기화된 플레이어 데이터 구조 (수동 대장 지정을 위한 manualLeaderId 속성 추가)
        let players = [
            {
                name: '플레이어 1',
                penaltyCount: 0,
                manualLeaderId: null, // 사용자가 직접 지정한 대장 탑 ID (null이면 자동 계산)
                towers: [
                    { id: 'pink', name: '사탕', bg: 'bg-pink-400', border: 'border-pink-500', text: 'text-pink-900', lightBg: 'bg-pink-50', count: 0, hasZero: false },
                    { id: 'purple', name: '으스스', bg: 'bg-purple-400', border: 'border-purple-500', text: 'text-purple-900', lightBg: 'bg-purple-50', count: 0, hasZero: false },
                    { id: 'green', name: '나무', bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-emerald-900', lightBg: 'bg-emerald-50', count: 0, hasZero: false },
                    { id: 'gray', name: '고철', bg: 'bg-slate-400', border: 'border-slate-500', text: 'text-slate-900', lightBg: 'bg-slate-50', count: 0, hasZero: false },
                    { id: 'yellow', name: '모래', bg: 'bg-amber-400', border: 'border-amber-500', text: 'text-amber-900', lightBg: 'bg-amber-50', count: 0, hasZero: false }
                ]
            }
        ];

        let currentPlayerIndex = 0;

        function addPlayer() {
            const input = document.getElementById('new-player-name');
            const name = input.value.trim();
            if (!name) return;
            if (players.some(p => p.name === name)) {
                alert('이미 존재하는 플레이어 이름입니다.');
                return;
            }

            players.push({
                name: name,
                penaltyCount: 0,
                manualLeaderId: null,
                towers: [
                    { id: 'pink', name: '사탕', bg: 'bg-pink-400', border: 'border-pink-500', text: 'text-pink-900', lightBg: 'bg-pink-50', count: 0, hasZero: false },
                    { id: 'purple', name: '으스스', bg: 'bg-purple-400', border: 'border-purple-500', text: 'text-purple-900', lightBg: 'bg-purple-50', count: 0, hasZero: false },
                    { id: 'green', name: '나무', bg: 'bg-emerald-500', border: 'border-emerald-600', text: 'text-emerald-900', lightBg: 'bg-emerald-50', count: 0, hasZero: false },
                    { id: 'gray', name: '고철', bg: 'bg-slate-400', border: 'border-slate-500', text: 'text-slate-900', lightBg: 'bg-slate-50', count: 0, hasZero: false },
                    { id: 'yellow', name: '모래', bg: 'bg-amber-400', border: 'border-amber-500', text: 'text-amber-900', lightBg: 'bg-amber-50', count: 0, hasZero: false }
                ]
            });
            input.value = '';
            currentPlayerIndex = players.length - 1;
            renderAll();
        }

        function removePlayer(index, event) {
            event.stopPropagation();
            if (players.length <= 1) {
                alert('최소 1명의 플레이어는 있어야 합니다.');
                return;
            }
            if (confirm(`${players[index].name} 플레이어를 삭제하시겠습니까?`)) {
                players.splice(index, 1);
                if (currentPlayerIndex >= players.length) {
                    currentPlayerIndex = players.length - 1;
                }
                renderAll();
            }
        }

        function switchPlayer(index) {
            currentPlayerIndex = index;
            renderAll();
        }

        function updateCount(towerId, delta) {
            let p = players[currentPlayerIndex];
            let t = p.towers.find(x => x.id === towerId);
            if (t) {
                t.count = Math.max(0, t.count + delta);
                // 장수가 0이 되거나 해서 대장탑으로 지정되었던 탑이 비게 되면 수동 대장 초기화
                if (p.manualLeaderId === towerId && t.count === 0 && !t.hasZero) {
                    p.manualLeaderId = null;
                }
                renderAll();
            }
        }

        function toggleZero(towerId) {
            let p = players[currentPlayerIndex];
            let t = p.towers.find(x => x.id === towerId);
            if (t) {
                t.hasZero = !t.hasZero;
                renderAll();
            }
        }

        // 대장탑 토글 (수동 지정/해제)
        function toggleLeader(towerId) {
            let p = players[currentPlayerIndex];
            let t = p.towers.find(x => x.id === towerId);
            
            // 빈 탑은 대장으로 지정할 수 없음
            let effectiveCount = t.hasZero ? Math.max(0, t.count - 1) : t.count;
            if (t.count === 0 && !t.hasZero) {
                alert('카드가 없는 빈 탑은 대장으로 지정할 수 없습니다.');
                return;
            }

            if (p.manualLeaderId === towerId) {
                // 이미 수동 대장인 상태에서 누르면 해제 (다시 자동 선정 모드로 복귀)
                p.manualLeaderId = null;
            } else {
                // 새로운 탑을 대장으로 수동 지정
                p.manualLeaderId = towerId;
            }
            renderAll();
        }

        function adjustPenalty(delta) {
            let p = players[currentPlayerIndex];
            p.penaltyCount = Math.max(0, p.penaltyCount + delta);
            renderAll();
        }

        function resetAll() {
            if (confirm('모든 플레이어의 탑과 허문카드 기록을 초기화하시겠습니까?')) {
                players.forEach(p => {
                    p.penaltyCount = 0;
                    p.manualLeaderId = null;
                    p.towers.forEach(t => {
                        t.count = 0;
                        t.hasZero = false;
                    });
                });
                renderAll();
            }
        }

        // 대장탑 결정 로직: 수동 지정된 값이 있으면 그 값을 우선 사용, 없으면 가장 장수가 많은 탑 자동 선정
        function determineLeaderTower(player) {
            if (player.manualLeaderId) {
                // 수동 지정된 탑이 실제로 유효한지 확인 (카드가 남아있는지)
                let t = player.towers.find(x => x.id === player.manualLeaderId);
                if (t && (t.count > 0 || t.hasZero)) {
                    return player.manualLeaderId;
                } else {
                    player.manualLeaderId = null; // 유효하지 않으면 자동 모드로 복구
                }
            }

            let maxCount = -1;
            let candidates = [];

            player.towers.forEach(t => {
                let effectiveCount = t.hasZero ? Math.max(0, t.count - 1) : t.count;

                if (effectiveCount > maxCount) {
                    maxCount = effectiveCount;
                    candidates = [t.id];
                } else if (effectiveCount === maxCount) {
                    candidates.push(t.id);
                }
            });

            if (maxCount <= 0) return null;
            return candidates[0]; // 중도시 첫 번째 후보 반환
        }

        function calculatePlayerScore(player) {
            let leaderId = determineLeaderTower(player);
            let totalTowerScore = 0;

            player.towers.forEach(tower => {
                let actualCards = tower.hasZero ? Math.max(0, tower.count - 1) : tower.count;
                if (actualCards === 0 && !tower.hasZero) return;

                let multiplier = tower.hasZero ? 2 : 1;
                let score = tower.count * multiplier;

                if (tower.id === leaderId) {
                    score += tower.count * 1;
                }
                totalTowerScore += score;
            });

            let penaltyScore = (player.penaltyCount * (player.penaltyCount + 1)) / 2;
            return {
                score: totalTowerScore - penaltyScore,
                leaderId: leaderId
            };
        }

        function renderAll() {
            const tabsContainer = document.getElementById('player-tabs');
            tabsContainer.innerHTML = '';
            players.forEach((p, idx) => {
                let isActive = idx === currentPlayerIndex;
                let btnClass = isActive ? 'bg-sky-600 text-white border-sky-700' : 'bg-sky-50 text-sky-800 border-sky-200 hover:bg-sky-100';
                tabsContainer.innerHTML += `
                    <div onclick="switchPlayer(${idx})" class="flex items-center gap-1 text-xs px-2.5 py-1.5 rounded-lg border font-bold whitespace-nowrap cursor-pointer crayon-btn ${btnClass}">
                        <span>👤 ${p.name}</span>
                        ${players.length > 1 ? `<span onclick="removePlayer(${idx}, event)" class="text-[10px] ml-1 text-rose-300 hover:text-rose-500 font-bold px-1">✕</span>` : ''}
                    </div>
                `;
            });

            let currentPlayer = players[currentPlayerIndex];
            document.getElementById('current-player-title').innerText = `🏗️ ${currentPlayer.name}의 탑 건설 현황`;
            document.getElementById('current-player-score-label').innerText = `${currentPlayer.name}의 최종 점수`;

            let leaderId = determineLeaderTower(currentPlayer);
            const towersContainer = document.getElementById('towers-container');
            towersContainer.innerHTML = '';

            currentPlayer.towers.forEach(tower => {
                let isLeader = (tower.id === leaderId && (tower.hasZero ? tower.count > 1 : tower.count > 0));
                
                let blocksHtml = '';
                
                if (tower.hasZero) {
                    blocksHtml += `<div class="w-full h-5 bg-white border-2 border-rose-500 text-rose-600 font-bold rounded-sm flex items-center justify-center text-[10px] shadow-sm my-0.5 tower-block">0 (꼭대기)</div>`;
                }

                let displayCount = Math.min(tower.count, 5); 
                for (let i = 0; i < displayCount; i++) {
                    blocksHtml += `<div class="w-full h-5 ${tower.bg} text-white rounded-sm flex items-center justify-center text-[10px] shadow-sm my-0.5 tower-block"></div>`;
                }
                if (tower.count > 5) {
                    blocksHtml = `<div class="text-[9px] text-slate-400 text-center">+${tower.count}장</div>` + blocksHtml;
                }
                if (tower.count === 0 && !tower.hasZero) {
                    blocksHtml = `<div class="h-16 flex items-center justify-center text-[10px] text-slate-300 italic">빈 탑</div>`;
                }

                let html = `
                    <div class="flex flex-col items-center bg-white p-1.5 rounded-xl border-2 ${isLeader ? 'border-amber-400 ring-2 ring-amber-200' : 'border-sky-100'} justify-between">
                        <div class="text-center w-full mb-1">
                            <span class="text-[10px] font-bold ${tower.text} block truncate">${tower.name}</span>
                            <button onclick="toggleLeader('${tower.id}')" class="text-[9px] px-1 py-0.5 rounded font-bold block mt-0.5 w-full transition-all ${isLeader ? 'bg-amber-400 text-amber-900 shadow-sm' : 'bg-slate-100 text-slate-400 hover:bg-slate-200'}">
                                ${isLeader ? '👑 대장 (지정됨)' : '👑 대장'}
                            </button>
                        </div>

                        <div class="w-full bg-slate-50 rounded-lg p-1 flex flex-col-reverse justify-end min-h-[90px] border border-slate-200 mb-2">
                            ${blocksHtml}
                        </div>

                        <div class="w-full flex flex-col gap-1">
                            <div class="flex items-center justify-between bg-sky-50 px-1 py-0.5 rounded text-[10px]">
                                <span>장수</span>
                                <strong class="${tower.text}">${tower.count}</strong>
                            </div>
                            <div class="flex justify-between gap-1">
                                <button onclick="updateCount('${tower.id}', -1)" class="w-full bg-slate-200 text-slate-700 rounded font-bold text-xs py-1">-</button>
                                <button onclick="updateCount('${tower.id}', 1)" class="${tower.bg} text-white rounded font-bold text-xs py-1 w-full">+</button>
                            </div>
                            <label class="flex items-center justify-center gap-0.5 text-[9px] text-slate-600 cursor-pointer bg-slate-100 py-0.5 rounded mt-0.5">
                                <input type="checkbox" ${tower.hasZero ? 'checked' : ''} onchange="toggleZero('${tower.id}')" class="accent-sky-500">
                                0탑꼭대기
                            </label>
                        </div>
                    </div>
                `;
                towersContainer.innerHTML += html;
            });

            document.getElementById('penalty-count').innerText = currentPlayer.penaltyCount;
            let penaltyScore = (currentPlayer.penaltyCount * (currentPlayer.penaltyCount + 1)) / 2;
            document.getElementById('penalty-score-text').innerText = `-${penaltyScore}점`;

            let currentRes = calculatePlayerScore(currentPlayer);
            document.getElementById('final-score-display').innerText = `${currentRes.score} 점`;

            const rankingContainer = document.getElementById('ranking-list');
            rankingContainer.innerHTML = '';

            let rankedPlayers = players.map((p, idx) => {
                let res = calculatePlayerScore(p);
                return { player: p, score: res.score, index: idx };
            }).sort((a, b) => b.score - a.score);

            rankedPlayers.forEach((rp, rank) => {
                let isSelected = rp.index === currentPlayerIndex;
                let bgClass = isSelected ? 'bg-sky-50 border-sky-300 ring-1 ring-sky-200' : 'bg-white border-slate-200';
                
                let miniTowersHtml = '';
                rp.player.towers.forEach(t => {
                    miniTowersHtml += `
                        <div class="flex flex-col items-center">
                            <div class="w-4 h-8 bg-slate-100 rounded-sm flex flex-col-reverse justify-start border border-slate-200 overflow-hidden">
                                <div class="w-full ${t.bg}" style="height: ${Math.min(t.count * 15, 100)}%;"></div>
                            </div>
                            <span class="text-[8px] text-slate-500 mt-0.5">${t.count}</span>
                        </div>
                    `;
                });

                rankingContainer.innerHTML += `
                    <div class="flex flex-col gap-1.5 p-2.5 rounded-xl border ${bgClass} shadow-sm">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="bg-sky-500 text-white font-bold text-xs px-2 py-0.5 rounded-full">${rank + 1}위</span>
                                <span class="font-bold text-slate-800 text-sm">${rp.player.name}</span>
                            </div>
                            <span class="text-sky-600 font-bold text-base">${rp.score}점</span>
                        </div>
                        <div class="flex justify-around bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                            ${miniTowersHtml}
                        </div>
                    </div>
                `;
            });
        }

        renderAll();
    </script>
</body>
</html>
